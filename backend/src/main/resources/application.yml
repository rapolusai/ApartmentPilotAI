server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  # Behind AWS ALB/nginx use the client IP from X-Forwarded-For (Tomcat trusts only internal proxy addresses).
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:native}
  error:
    include-stacktrace: never
    include-message: never
spring:
  application:
    name: apartmentpilotai
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/partmentpilotai_dev}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 8
      connection-init-sql: SET search_path TO apartmentpilotai,public
  flyway:
    schemas: apartmentpilotai
    default-schema: apartmentpilotai
    create-schemas: true
    clean-disabled: true
    baseline-on-migrate: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  local-registration-enabled: false
  session-hours: 12
  billing-job-enabled: false
  # Shown on the public privacy and account-deletion pages. Empty = the pages point at the Play listing's contact.
  support-email: ${SUPPORT_EMAIL:}
  invite-display-key: ${APP_INVITE_DISPLAY_KEY:}
  # PIN login protection (LoginGuard). Only failed attempts count; a correct PIN clears them.
  # enabled=false falls back to the old per-mobile limit of 10 attempts per 15 minutes.
  login-guard:
    enabled: true
    device-free-failures: 5      # tier A: same mobile + client IP
    device-cap-minutes: 60
    account-free-failures: 20    # tier B: same mobile from any IP
    account-cap-minutes: 15
    ip-failures-per-15-minutes: 30
    decay-hours: 24
