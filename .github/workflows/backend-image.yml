name: Backend image
# Builds the production Docker image after the tests pass and publishes it to GitHub Container Registry.
# Publishing an image never deploys it: a person runs the update step in deploy/README.md on the server.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['backend/**', '.github/workflows/backend-image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: apt_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tests (unit and database integration)
        working-directory: backend
        env:
          APT_TEST_DB_URL: jdbc:postgresql://localhost:5432/apt_ci
          APT_TEST_DB_USER: postgres
          APT_TEST_DB_PASSWORD: ci-only-throwaway
        run: mvn -B test
      - name: Image tags
        id: tags
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/apartmentpilotai-backend
          SHORT=${GITHUB_SHA::7}
          TAGS="${IMAGE}:${SHORT}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then TAGS="${TAGS},${IMAGE}:${GITHUB_REF_NAME},${IMAGE}:latest"; fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
