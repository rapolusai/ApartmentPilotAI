plugins { id 'com.android.application' }
android {
 namespace 'com.rapolus.apartmentpilotai'
 compileSdk 36
 defaultConfig {
  applicationId 'com.rapolus.apartmentpilotai'
  minSdk 26
  targetSdk 36
  versionCode 2
  versionName '0.2.0-local'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 }
 buildFeatures { buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildTypes {
  debug {
   applicationIdSuffix '.debug'
   versionNameSuffix '-dev'
   buildConfigField 'String','API_BASE_URL','"http://10.0.2.2:8080/api/v1"'
  }
  release {
   minifyEnabled false
   // The real address is a build setting, never source: -PapiBaseUrl=https://api.apartmentcare.<domain>/api/v1
   // (or apiBaseUrl= in an uncommitted gradle.properties). The placeholder keeps an unconfigured build harmless.
   buildConfigField 'String','API_BASE_URL','"' + (project.findProperty('apiBaseUrl') ?: 'https://api.example.invalid/api/v1') + '"'
   // This increment is intentionally not release-ready. Do not ship a local/dev build.
  }
 }
}
tasks.configureEach { t ->
 if (t.name == 'preReleaseBuild') {
  t.doFirst { throw new GradleException('Increment 02 is for local testing only. See docs/IMPLEMENTATION_STATUS.md before enabling release builds.') }
 }
}
dependencies {
 implementation 'androidx.appcompat:appcompat:1.7.1'
 implementation 'androidx.core:core:1.16.0'
 implementation 'com.google.android.material:material:1.13.0'
 implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
 testImplementation 'junit:junit:4.13.2'
}
