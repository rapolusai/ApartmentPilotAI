plugins { id 'com.android.application' }
// Release signing: the upload keystore and its passwords live in android/keystore.properties (git-ignored) or in the
// environment (APT_KEYSTORE_FILE, APT_KEYSTORE_PASSWORD, APT_KEY_ALIAS, APT_KEY_PASSWORD). Never in this file.
def keystoreProperties = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProperties.load(it) }
def signing = { String key, String env -> keystoreProperties.getProperty(key) ?: System.getenv(env) }
def releaseApiBaseUrl = project.findProperty('apiBaseUrl') ?: System.getenv('APT_API_BASE_URL')
android {
 namespace 'com.rapolus.apartmentpilotai'
 compileSdk 36
 defaultConfig {
  applicationId 'com.rapolus.apartmentpilotai'
  minSdk 26
  targetSdk 36
  versionCode 3
  versionName '0.3.0'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 }
 buildFeatures { buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 signingConfigs {
  release {
   def file = signing('storeFile', 'APT_KEYSTORE_FILE')
   if (file != null) {
    storeFile rootProject.file(file)
    storePassword signing('storePassword', 'APT_KEYSTORE_PASSWORD')
    keyAlias signing('keyAlias', 'APT_KEY_ALIAS')
    keyPassword signing('keyPassword', 'APT_KEY_PASSWORD')
   }
  }
 }
 buildTypes {
  debug {
   applicationIdSuffix '.debug'
   versionNameSuffix '-dev'
   buildConfigField 'String','API_BASE_URL','"http://10.0.2.2:8080/api/v1"'
  }
  release {
   minifyEnabled false
   // The real address is a build setting, never source: -PapiBaseUrl=https://api.apartmentcare.rapolu.in/api/v1,
   // APT_API_BASE_URL, or apiBaseUrl= in an uncommitted gradle.properties. The placeholder keeps a stray build harmless.
   buildConfigField 'String','API_BASE_URL','"' + (releaseApiBaseUrl ?: 'https://api.example.invalid/api/v1') + '"'
   signingConfig signingConfigs.release
  }
 }
}
// A release build must point at a real HTTPS server and be signed with the upload key; anything else is refused
// here rather than discovered on the Play Console. Debug builds are unaffected.
tasks.configureEach { t ->
 if (t.name == 'preReleaseBuild') {
  t.doFirst {
   if (releaseApiBaseUrl == null || !releaseApiBaseUrl.startsWith('https://') || releaseApiBaseUrl.contains('example.invalid'))
    throw new GradleException('Release build needs the live API address: -PapiBaseUrl=https://api.apartmentcare.rapolu.in/api/v1 (or APT_API_BASE_URL).')
   if (signing('storeFile', 'APT_KEYSTORE_FILE') == null)
    throw new GradleException('Release build needs the upload keystore: android/keystore.properties or APT_KEYSTORE_* variables. See docs/RELEASE.md.')
  }
 }
}
dependencies {
 implementation 'androidx.appcompat:appcompat:1.7.1'
 implementation 'androidx.core:core:1.16.0'
 implementation 'com.google.android.material:material:1.13.0'
 implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
 testImplementation 'junit:junit:4.13.2'
}
